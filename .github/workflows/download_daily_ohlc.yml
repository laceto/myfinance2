name: Download Daily OHLC Data

on:
  # 21:00 UTC = 22:00 CET (winter) / 23:00 CEST (summer, UTC+2)
  # Runs Mon–Fri only (Borsa Italiana is closed on weekends)
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    strategy:
      # Independent markets: a failure in one must not cancel or block the
      # other. Each leg downloads, appends, and commits ONLY its own market.
      fail-fast: false
      matrix:
        include:
          - market: it
            script: get_daily_ohlc_data.py
          - market: etf
            script: get_daily_ohlc_data_etf.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas openpyxl pyarrow joblib tqdm
          pip install algoshort-0.1.1-py3-none-any.whl

      - name: Create output directory
        run: mkdir -p data/ohlc/today/${{ matrix.market }}

      - name: Download ${{ matrix.market }} OHLC
        run: python ${{ matrix.script }}

      - name: Append ${{ matrix.market }} today data to historical
        run: python append_daily_to_historical.py --market ${{ matrix.market }}

      - name: Commit and push ${{ matrix.market }} data
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/ohlc/today/${{ matrix.market }}/ohlc_data.parquet \
                  data/ohlc/historical/${{ matrix.market }}/ohlc_data.parquet
          if git diff --cached --quiet; then
            echo "No changes to commit for ${{ matrix.market }}"
            exit 0
          fi
          git commit -m "chore: update daily OHLC data (${{ matrix.market }}) [skip ci]"
          # The two market legs run in parallel and push to the same branch.
          # They touch different files, so on a rejected push we just fetch the
          # other leg's commit and rebase on top — never losing either market.
          # --autostash keeps the rebase robust even if the run left any tracked
          # file unstaged (rebase refuses to run on a dirty tree otherwise).
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; syncing and retrying (attempt $attempt)"
            git fetch origin "${{ github.ref_name }}"
            git rebase --autostash "origin/${{ github.ref_name }}" || { git rebase --abort; exit 1; }
          done
          echo "failed to push ${{ matrix.market }} data after retries"
          exit 1
