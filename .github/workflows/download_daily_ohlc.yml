name: Download Daily OHLC Data

on:
  # 21:00 UTC = 22:00 CET (winter) / 23:00 CEST (summer, UTC+2)
  # Runs Mon–Fri only (Borsa Italiana is closed on weekends)
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-ohlc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas openpyxl pyarrow joblib tqdm
          pip install algoshort-0.1.1-py3-none-any.whl

      - name: Create output directories
        run: mkdir -p data/ohlc/today/it data/ohlc/today/etf

      # Both markets download sequentially in a single job. A matrix would run
      # two jobs that each `git push` to this branch, racing on the same ref;
      # sequential keeps a single atomic commit. If a download fails, the job
      # fails before committing, so no partial/stale data is published.
      - name: Download it OHLC (Borsa Italiana)
        run: python get_daily_ohlc_data.py

      - name: Download etf OHLC (ETF universe)
        run: python get_daily_ohlc_data_etf.py

      # append_daily_to_historical.py is the single, unit-tested source of
      # truth for folding today's bar into history (see tests/).
      - name: Append it today data to historical
        run: python append_daily_to_historical.py --market it

      - name: Append etf today data to historical
        run: python append_daily_to_historical.py --market etf

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/ohlc/today/it/ohlc_data.parquet data/ohlc/historical/it/ohlc_data.parquet \
                  data/ohlc/today/etf/ohlc_data.parquet data/ohlc/historical/etf/ohlc_data.parquet
          git commit -m "chore: update daily OHLC data (it, etf) [skip ci]" || echo "No changes to commit"
          git push
