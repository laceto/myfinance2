name: Analyze Stocks and Generate Report

on:
  # Runs automatically after the OHLC download workflow succeeds.
  # workflow_run fires on the default branch once the named workflow completes.
  workflow_run:
    workflows: ["Download Daily OHLC Data"]
    types: [completed]
  # Allow manual trigger for testing or catch-up runs.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Skip if triggered by a failed download run (but always run on manual dispatch).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas openpyxl pyarrow joblib tqdm numpy statsmodels
          pip install algoshort-0.1.1-py3-none-any.whl

      - name: Run signal analysis
        run: python analyze_stock.py

      - name: Generate trading report
        # tee writes to file AND streams to the workflow log simultaneously.
        run: python trading_report.py | tee data/results/it/trading_report.txt

      - name: Generate daily insights brief
        run: python get_insights.py | tee data/results/it/daily_brief.txt

      # analysis_results.parquet is ~500 MB — too large for a git commit.
      # Upload it as a workflow artifact (retained for 30 days) instead.
      - name: Upload analysis parquet as artifact
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results-${{ github.run_id }}
          path: data/results/it/analysis_results.parquet
          retention-days: 30

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/results/it/trading_dashboard.xlsx \
                  data/results/it/trading_report.txt \
                  data/results/it/daily_brief.xlsx \
                  data/results/it/daily_brief.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update trading dashboard, report and daily insights brief [skip ci]"
          # The ETF Return Analysis workflow also fires on the same download
          # completion and pushes to this branch; rebase-retry on a rejected
          # push (disjoint files: results/it vs results/etf -> no conflict).
          # --autostash is REQUIRED: the analysis run regenerates tracked files
          # we deliberately do NOT commit (cumul_snapshot.xlsx, returns_dashboard.xlsx,
          # trending_dashboard.xlsx, trending_heatmap.png), leaving the tree dirty.
          # Without --autostash, `git rebase` aborts with "cannot rebase: you have
          # unstaged changes" and the whole job fails.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; syncing and retrying (attempt $attempt)"
            git fetch origin "${{ github.ref_name }}"
            git rebase --autostash "origin/${{ github.ref_name }}" || { git rebase --abort; exit 1; }
          done
          echo "failed to push after retries"
          exit 1

  # Refresh the rolling bull + bear flip history AFTER analyze has committed
  # today's daily_brief.txt. Kept as a SEPARATE job (not a step in `analyze`) on
  # purpose: signal_flips_history.py walks the git history of daily_brief.txt,
  # which needs a FULL-history + blobless checkout. Doing that inline would force
  # changing the analyze job's (shallow, default) checkout — a needless risk to
  # the core pipeline. This job is self-contained and, if it ever breaks, the
  # analyze results are already safely committed by the job above.
  refresh-signal-flips:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history, blobless)
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 -> the month-long git-log walk sees every commit.
          # filter: blob:none -> commit graph + trees only; the small
          # daily_brief.txt blobs are fetched lazily by `git show`, so we do NOT
          # download the repo's large historical parquet blobs.
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        # No pip install: signal_flips_history.py uses only the Python standard
        # library (re, subprocess, argparse, dataclasses, ...).

      - name: Sync to the brief the analyze job just pushed
        # workflow_run checks out the triggering SHA (the download commit), not
        # analyze's freshly-pushed brief commit. Reset to the branch tip so the
        # history walk includes today's daily_brief.txt.
        run: |
          git fetch origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"

      - name: Regenerate signal-flip history (bull + bear, last month)
        run: |
          python signal_flips_history.py \
            --direction both \
            --revision HEAD \
            --since "1 month ago"

      - name: Commit signal-flip history
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/results/it/bull_flips_last_month.txt \
                  data/results/it/bear_flips_last_month.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh signal-flip history (bull+bear) [skip ci]"
          # Concurrent pushers (download legs, analyze, etf_returns) may touch the
          # branch around now; rebase-retry with --autostash (disjoint file, so
          # the rebase never conflicts) — same CI concurrency invariant as the
          # other committing jobs.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; syncing and retrying (attempt $attempt)"
            git fetch origin "${{ github.ref_name }}"
            git rebase --autostash "origin/${{ github.ref_name }}" || { git rebase --abort; exit 1; }
          done
          echo "failed to push after retries"
          exit 1
